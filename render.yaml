services:
  - type: web
    name: infera-backend
    runtime: python
    rootDir: backend
    plan: 1c-2g    # 1 CPU / 2GB RAM — measured peak usage is ~850MB, this leaves real headroom
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: INFERA_OPENALEX_CONTACT_EMAIL
        sync: false
      # Set this AFTER the frontend service below is created and you can see
      # its real URL — e.g. https://infera-frontend.onrender.com (with the
      # scheme, no trailing slash). See README's Deploying section.
      - key: INFERA_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: infera-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this AFTER the backend service above is created and you can see
      # its real URL — e.g. https://infera-backend.onrender.com (with the
      # scheme, no trailing slash).
      - key: VITE_API_BASE
        sync: false
