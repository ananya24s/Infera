# Reverse proxy: public port 80 -> the backend's uvicorn process, which only
# listens on localhost (127.0.0.1:8001), never directly exposed.
#
# Replace YOUR_DOMAIN_OR_IP below with your actual domain name, or the VM's
# public IP if you don't have a domain yet. After this is in place, run
# `sudo certbot --nginx` (see DEPLOYMENT.md) to add HTTPS automatically —
# it rewrites this file's server block itself, so leave port 80 as plain
# HTTP here.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Requests can be slow (retrieval + NLI + LLM in the same request).
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
